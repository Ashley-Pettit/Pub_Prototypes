<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roster Builder</title>
<meta name="version" content="4.0">
<meta name="description" content="Rapid prototype: plan a fortnightly team roster with RDOs, rotations, leave and cover checks.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232552a3'/%3E%3Cg fill='%23fff'%3E%3Crect x='7' y='8' width='5' height='5' rx='1'/%3E%3Crect x='14' y='8' width='5' height='5' rx='1' opacity='.5'/%3E%3Crect x='21' y='8' width='5' height='5' rx='1'/%3E%3Crect x='7' y='15' width='5' height='5' rx='1'/%3E%3Crect x='14' y='15' width='5' height='5' rx='1'/%3E%3Crect x='21' y='15' width='5' height='5' rx='1' opacity='.5'/%3E%3Crect x='7' y='22' width='5' height='3' rx='1' opacity='.5'/%3E%3Crect x='14' y='22' width='5' height='3' rx='1'/%3E%3Crect x='21' y='22' width='5' height='3' rx='1'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600&family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="banner" role="note">
  <div class="inner"><i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i><span><strong>Rapid prototype, not an endorsed tool.</strong> Do not enter council data. For management review as a concept only.</span></div>
</div>

<div id="app" v-cloak>
  <header class="topbar">
    <div class="inner">
      <a class="brand" href="#team"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="brand-name">Roster Builder</span></a>
      <nav class="steps" aria-label="Steps">
        <a v-for="([k, n, short], i) in nav" :key="k" :href="'#' + k" :aria-current="ui.route === k ? 'step' : null"><span class="num" aria-hidden="true">{{ i + 1 }}</span>{{ n }}</a>
      </nav>
      <span class="spacer"></span>
      <a class="xchip" :class="'xc-' + chip.cls" href="#excel" :aria-label="excelState.title + '. Go to the Excel step.'"><i class="bi" :class="chip.icon" aria-hidden="true"></i><span>{{ chip.text }}</span></a>
      <a class="btn btn-quiet btn-icon" href="#settings" v-tip="'Settings'" :aria-current="ui.route === 'settings' ? 'page' : null"><i class="bi bi-gear" aria-hidden="true"></i></a>
      <button type="button" class="btn btn-quiet btn-icon" :disabled="!store.undo.length" v-tip="{ text: 'Undo last change', kbd: MOD + 'Z' }" @click="undo"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i></button>
    </div>
  </header>

  <main class="page" id="main" tabindex="-1">
    <component :is="page"></component>
  </main>

  <nav class="tabbar" aria-label="Steps">
    <a v-for="([k, n, short], i) in nav" :key="k" :href="'#' + k" :aria-current="ui.route === k ? 'step' : null"><span class="num" aria-hidden="true">{{ i + 1 }}</span><span>{{ short }}</span><i v-if="k === 'excel' && chip.cls === 'changed'" class="dot" aria-label="Not in Excel yet"></i></a>
  </nav>

  <div v-if="pop && popP" class="pop-scrim" @click="closePop(false)"></div>
  <div v-if="pop && popP" ref="pop" class="pop" :style="popPos || { left: '-9999px', top: '0' }" role="dialog" :aria-label="v(popP) + ', ' + nice(pop.iso)" @keydown.esc.stop="closePop()">
    <div class="pop-head"><b>{{ v(popP) }}, {{ nice(pop.iso) }}</b><span class="meta">Now {{ popVal }}{{ popChanged ? ', changed for this day' : '' }}</span></div>
    <div role="menu" :aria-label="'Set ' + v(popP) + ' for ' + nice(pop.iso)">
      <button v-for="o in [[cfg.shifts.early, 'var(--early)'], [cfg.shifts.late, 'var(--late)'], ['RDO', 'var(--rdo)'], ['Leave', 'var(--leave)']]" :key="o[0]" type="button" class="menu-item" role="menuitemradio" :aria-checked="popVal === o[0] ? 'true' : 'false'" @click="choose(o[0])"><span class="swatch" :style="{ background: o[1] }"></span>{{ o[0] === 'RDO' ? 'Make it an RDO' : o[0] === 'Leave' ? 'Mark as leave' : 'Work ' + o[0] }}</button>
      <button v-if="popChanged" type="button" class="menu-item" role="menuitem" @click="choose(null)"><i class="bi bi-arrow-return-left" aria-hidden="true"></i>Set back to the plan</button>
    </div>
  </div>

  <template v-if="dlg">
    <div class="scrim dialog-scrim" @click="closeDlg"></div>
    <div class="dialog" ref="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-b" @keydown="dlgKey">
      <h2 id="dlg-t">{{ dlg.title }}</h2>
      <p id="dlg-b">{{ dlg.body }}</p>
      <div class="btns">
        <button type="button" class="btn btn-quiet" ref="cancel" @click="closeDlg">Cancel</button>
        <button type="button" class="btn" :class="dlg.danger === false ? 'btn-primary' : 'btn-danger'" @click="runDlg">{{ dlg.confirm }}</button>
      </div>
    </div>
  </template>

  <div class="toasts" aria-live="polite" role="status">
    <div v-for="t in store.toasts" :key="t.id" class="toast-item" :class="{ bad: t.bad }">
      <span class="grow">{{ t.text }}</span>
      <button v-if="t.undo" type="button" class="btn" @click="undo(); store.toasts = []">Undo</button>
      <button type="button" class="btn btn-icon" v-tip="'Dismiss message'" @click="store.toasts = []"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
    </div>
  </div>
</div>

<!-- Roster (Pattern 7: Calendar) -->
<script type="text/x-template" id="tpl-roster">
<div>
  <div class="page-head">
    <div>
      <div class="stepnum">Step 2 of 4</div>
      <h1 tabindex="-1">Check the roster</h1>
      <p class="lede">{{ cfg.title }}, {{ periodLabel(cfg) }}. Tap any shift to change that day. If something needs fixing, it's listed below.</p>
    </div>
    <div class="actions replan-wide">
      <button type="button" class="btn btn-quiet" @click="replan" :aria-busy="ui.busy === 'replan' ? 'true' : 'false'"><span v-if="ui.busy === 'replan'" class="spinner-border spinner-border-sm" aria-hidden="true"></span><i v-else class="bi bi-arrow-repeat" aria-hidden="true"></i>Re-plan RDOs</button>
    </div>
  </div>

  <section class="surface mb-3" aria-labelledby="chk-h">
    <div v-if="!issues.length" class="allclear"><i class="bi bi-check-circle-fill" aria-hidden="true"></i><span id="chk-h"><b class="text-success">Roster checks out.</b> <span>Cover, rotations and RDOs are all OK.</span></span></div>
    <template v-else>
      <div class="issues-head"><div class="title" id="chk-h"><i class="bi bi-exclamation-circle-fill text-danger" aria-hidden="true"></i>{{ plural(issues.length, 'thing') }} to check</div><span class="text-2 small-2">Select a cell to change a day, or re-plan RDOs.</span></div>
      <div v-for="iss in issues.slice(0, 6)" :key="iss.id" class="issue" :class="'sev' + iss.severity">
        <i class="bi ico" :class="iss.severity === 2 ? 'bi-exclamation-circle-fill' : 'bi-exclamation-triangle-fill'" aria-hidden="true"></i>
        <div><div class="what">{{ iss.title }}</div><div class="why">{{ iss.detail }}</div></div>
      </div>
      <div v-if="issues.length > 6" class="issue"><span></span><div class="why">And {{ plural(issues.length - 6, 'more') }}.</div></div>
    </template>
  </section>

  <div class="toolbar">
    <button type="button" class="btn btn-quiet replan-narrow" @click="replan"><i class="bi bi-arrow-repeat" aria-hidden="true"></i>Re-plan RDOs</button>
    <div class="seg viewtoggle" role="group" aria-label="View">
      <button type="button" :aria-pressed="ui.rosterView === 'period' ? 'true' : 'false'" @click="setView('period')">All {{ cfg.weeks }} weeks</button>
      <button type="button" :aria-pressed="ui.rosterView === 'week' ? 'true' : 'false'" @click="setView('week')">One week</button>
    </div>
    <div v-if="week" class="seg weekpick" role="tablist" aria-label="Week">
      <button v-for="w in cfg.weeks" :key="w" type="button" role="tab" :aria-selected="ui.week === w - 1 ? 'true' : 'false'" @click="ui.week = w - 1">Week {{ w }}</button>
    </div>
  </div>

  <section class="surface" aria-label="Roster grid">
    <div class="grid-wrap">
      <table class="rgrid" :class="{ week: week }">
        <thead>
          <tr class="weeks" v-if="!week">
            <th class="sticky" scope="col"><span class="visually-hidden">Person</span></th>
            <th v-for="w in cfg.weeks" :key="w" colspan="5" scope="colgroup" :class="(w - 1) % 2 === 0 ? 'pp' : 'wk'">Week {{ w }} <span class="text-3">· pay period {{ Math.floor((w - 1) / 2) + 1 }}</span></th>
          </tr>
          <tr>
            <th class="sticky" scope="col">Person</th>
            <th v-for="d in days" :key="d.iso" scope="col" :class="wk(d)"><div class="dayhead" :class="{ short: shortDays.has(d.i) }"><span>{{ E.DAYS[d.dow - 1] }}</span><span class="d">{{ fmt(d.iso) }}</span></div></th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="p in R.ro" :key="p.id">
            <th class="sticky" scope="row"><div class="who" :class="{ vacant: v(p) === 'Vacant' }"><span class="nm">{{ v(p) }}</span><span class="role">{{ p.role }}</span></div></th>
            <td v-for="d in days" :key="d.iso" :class="[cellClass(val(p, d)), { changed: changed(p, d) }, wk(d)]">
              <button type="button" class="cell" @click="openCell($event, p, d)" :aria-label="v(p) + ', ' + nice(d.iso) + ': ' + val(p, d) + (changed(p, d) ? ', changed for this day' : '')">
                <span>{{ val(p, d) }}</span>
                <span v-if="week && duties(p, d).length" class="duty">{{ duties(p, d).join(', ') }}</span>
              </button>
            </td>
          </tr>
          <tr class="band"><th class="sticky" scope="row">Cover</th><td :colspan="days.length"></td></tr>
          <tr class="cov" v-for="row in [['early', 'On ' + cfg.shifts.early, cfg.rules.minEarly], ['late', 'On ' + cfg.shifts.late, cfg.rules.minLate], ['senior', E.seniorLabel(cfg).replace(' on duty', ''), cfg.rules.minSenior]].concat(R.cols[0].siteB != null ? [['siteB', cfg.rules.siteB.label, cfg.rules.siteB.min]] : [])" :key="row[0]">
            <th class="sticky" scope="row">{{ row[1] }} <span class="meta">min {{ row[2] }}</span></th>
            <td v-for="d in days" :key="d.iso" class="n" :class="[{ low: R.cols[d.i][row[0]] < row[2] }, wk(d)]">{{ R.cols[d.i][row[0]] }}</td>
          </tr>
          <template v-if="rotRows.length">
            <tr class="band"><th class="sticky" scope="row">Rotations</th><td :colspan="days.length"></td></tr>
            <tr v-for="row in rotRows" :key="row.col" :class="row.cls">
              <th class="sticky" scope="row">{{ row.label }} <span class="meta">{{ row.note }}</span></th>
              <td v-for="d in days" :key="d.iso" class="rc" :class="[{ clash: clash(row, d) }, wk(d)]"><span class="rot-cell d-flex align-items-center justify-content-center">{{ R.cols[d.i][row.col] }}</span></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
    <div class="legend" aria-label="Key">
      <span><i style="background: var(--early)"></i>{{ cfg.shifts.early }}</span>
      <span><i style="background: var(--late)"></i>{{ cfg.shifts.late }}</span>
      <span><i style="background: var(--rdo)"></i>RDO</span>
      <span><i style="background: var(--leave)"></i>Leave</span>
      <span><i class="mk-changed"></i>Changed for one day</span>
      <span><i class="mk-clash"></i>Rostered but off</span>
      <span class="ms-auto text-3">Tap a shift to change that day.</span>
    </div>
  </section>
  <div class="nextstep"><span class="text-2">{{ issues.length ? 'Sort out anything listed above, then' : 'Looks good.' }} Next, add any leave or RDO moves.</span><a class="btn btn-primary" href="#leave">Next: leave and RDOs<i class="bi bi-arrow-right" aria-hidden="true"></i></a></div>
</div>
</script>

<!-- Team (Pattern 1: List, edited in place) -->
<script type="text/x-template" id="tpl-team">
<div>
  <section v-if="!ui.introHidden" class="surface intro mb-3" aria-labelledby="intro-h">
    <div>
      <h2 id="intro-h" class="h-intro">Make the roster in 4 steps</h2>
      <ol class="introsteps">
        <li><b>Team.</b> Put names against roles.</li>
        <li><b>Check the roster.</b> Shifts and RDOs are planned for you, with cover checked every day.</li>
        <li><b>Leave and RDOs.</b> Add any approved leave or RDO moves.</li>
        <li><b>Download Excel.</b> That file is the master copy for the team.</li>
      </ol>
    </div>
    <button type="button" class="btn btn-quiet btn-icon" v-tip="'Hide these steps'" @click="ui.introHidden = true; savePref()"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
  </section>
  <div class="page-head">
    <div><div class="stepnum">Step 1 of 4</div><h1 tabindex="-1">Who's on the roster</h1><p class="lede">Type each person's name next to their role. Changes save as you go. Leave a name blank to show the role as Vacant.</p></div>
    <div class="actions"><button type="button" class="btn btn-primary" @click="add('analyst')"><i class="bi bi-person-plus" aria-hidden="true"></i>Add analyst</button></div>
  </div>
  <section class="surface">
    <div class="grid-wrap">
      <table class="dtable team-edit">
        <thead><tr><th scope="col">Name</th><th scope="col">Role</th><th scope="col">Group</th><th scope="col">Shift pattern</th><th scope="col"><span class="visually-hidden">Remove</span></th></tr></thead>
        <tbody>
          <tr v-for="p in people" :key="p.id">
            <td><label class="cell-label" :for="'name-' + p.id">Name<span class="visually-hidden"> for {{ p.role }}</span></label><input :id="'name-' + p.id" class="form-control" :value="p.name" placeholder="Vacant" maxlength="40" autocomplete="off" @change="setField(p, 'name', $event)"></td>
            <td><label class="cell-label" :for="'role-' + p.id">Role</label><input :id="'role-' + p.id" class="form-control" :class="{ 'is-invalid': errs[p.id] }" :value="p.role" maxlength="40" @blur="setField(p, 'role', $event)" @input="clearErr(p)"><div class="invalid-msg" v-if="errs[p.id]">{{ errs[p.id] }}</div></td>
            <td><label class="cell-label" :for="'grp-' + p.id">Group<span class="visually-hidden"> for {{ p.role }}</span></label><select :id="'grp-' + p.id" class="form-select" :value="p.group" @change="setField(p, 'group', $event)"><option value="leader">Lead (no rotations)</option><option value="senior">Senior (on call)</option><option value="analyst">Analyst (front desk, seats)</option></select></td>
            <td><label class="cell-label" :for="'pat-' + p.id">Shift pattern<span class="visually-hidden"> for {{ p.role }}</span></label><select :id="'pat-' + p.id" class="form-select" :value="p.pattern" @change="setField(p, 'pattern', $event)"><option value="alt">Swaps each pay period</option><option value="early">Always {{ cfg.shifts.early }}</option><option value="late">Always {{ cfg.shifts.late }}</option></select></td>
            <td class="text-end"><button type="button" class="btn btn-quiet btn-icon" v-tip="'Remove ' + v(p)" @click="remove(p)"><i class="bi bi-trash3" aria-hidden="true"></i></button></td>
          </tr>
          <tr v-if="!people.length"><td colspan="5" class="p-0"><div class="empty"><h3>No one on the roster yet</h3><p>Add the people you roster so cover and rotations can be planned.</p><button type="button" class="btn btn-primary" @click="add('analyst')">Add analyst</button></div></td></tr>
        </tbody>
      </table>
    </div>
    <div class="pager"><span>{{ plural(people.length, 'person', 'people') }}</span><span class="d-flex gap-2 flex-wrap"><button type="button" class="btn btn-quiet" @click="add('senior')">Add senior</button><button type="button" class="btn btn-quiet" @click="add('leader')">Add lead</button></span></div>
  </section>
  <p class="meta mt-3">The sample team uses made-up names. If you add or remove people, use Re-plan RDOs on the next step.</p>
  <div class="nextstep"><span class="text-2">Team looks right? Next, check the roster.</span><a class="btn btn-primary" href="#roster">Next: check the roster<i class="bi bi-arrow-right" aria-hidden="true"></i></a></div>
</div>
</script>

<!-- Leave and RDO changes (Pattern 3: Form page with its list) -->
<script type="text/x-template" id="tpl-leave">
<div>
  <div class="page-head"><div><div class="stepnum">Step 3 of 4</div><h1 tabindex="-1">Leave and RDO moves</h1><p class="lede">Add approved leave, or move someone's RDO to another day. Both show on the roster and go into the Excel file. Nothing to add? Skip to the next step.</p></div></div>
  <div class="two-col">
    <section class="surface" aria-labelledby="lv-h">
      <div class="section-pad"><h2 id="lv-h">Leave</h2>
        <form class="addform" novalidate @submit.prevent="addLeave">
          <div><label class="form-label" for="lv-pid">Person</label><select id="lv-pid" class="form-select" v-model="lf.pid"><option v-for="p in people" :key="p.id" :value="p.id">{{ v(p) }}</option></select></div>
          <div><label class="form-label" for="lv-from">First day</label><input id="lv-from" type="date" class="form-control" v-model="lf.from" :min="minD" :max="maxD" :class="{ 'is-invalid': lt.from && lErr.from }" @blur="lt.from = true" @focus="lt.from = false"><div class="invalid-msg" v-if="lt.from && lErr.from">{{ lErr.from }}</div></div>
          <div><label class="form-label" for="lv-to">Last day</label><input id="lv-to" type="date" class="form-control" v-model="lf.to" :min="lf.from || minD" :max="maxD" :class="{ 'is-invalid': lt.to && lErr.to }" @blur="lt.to = true" @focus="lt.to = false"><div class="invalid-msg" v-if="lt.to && lErr.to">{{ lErr.to }}</div></div>
          <div><label class="form-label" for="lv-note">Note <span class="text-3">(optional)</span></label><input id="lv-note" class="form-control" v-model="lf.note" maxlength="80" placeholder="Annual leave"></div>
          <div class="addbtn"><button type="submit" class="btn btn-primary"><i class="bi bi-plus-lg" aria-hidden="true"></i>Add leave</button></div>
        </form>
      </div>
      <table class="dtable">
        <thead><tr><th scope="col">Person</th><th scope="col">Days</th><th scope="col">Note</th><th scope="col"><span class="visually-hidden">Remove</span></th></tr></thead>
        <tbody>
          <tr v-for="l in cfg.leave" :key="l.id"><td>{{ name(l.pid) }}</td><td class="tnum">{{ nice(l.from) }}<span v-if="l.to && l.to !== l.from"> to {{ nice(l.to) }}</span></td><td class="text-2">{{ l.note }}</td><td class="text-end"><button type="button" class="btn btn-quiet btn-icon" v-tip="'Remove ' + name(l.pid) + '\'s leave'" @click="removeLeave(l)"><i class="bi bi-trash3" aria-hidden="true"></i></button></td></tr>
          <tr v-if="!cfg.leave.length"><td colspan="4" class="text-2">No leave recorded. Add it above, or select a cell on the roster and choose Mark as leave.</td></tr>
        </tbody>
      </table>
    </section>
    <section class="surface" aria-labelledby="sw-h">
      <div class="section-pad"><h2 id="sw-h">RDO moves</h2>
        <form class="addform" novalidate @submit.prevent="addSwap">
          <div><label class="form-label" for="sw-pid">Person</label><select id="sw-pid" class="form-select" v-model="sf.pid" @change="pickSwapPerson"><option v-for="p in people" :key="p.id" :value="p.id">{{ v(p) }}</option></select></div>
          <div><label class="form-label" for="sw-from">Move this RDO</label><select id="sw-from" class="form-select" v-model="sf.from" :class="{ 'is-invalid': st.from && sErr.from }"><option v-for="d in rdoDates" :key="d" :value="d">{{ nice(d) }}</option></select><div class="invalid-msg" v-if="st.from && sErr.from">{{ sErr.from }}</div></div>
          <div><label class="form-label" for="sw-to">To</label><input id="sw-to" type="date" class="form-control" v-model="sf.to" :min="minD" :max="maxD" :class="{ 'is-invalid': st.to && sErr.to }" @blur="st.to = true" @focus="st.to = false"><div class="invalid-msg" v-if="st.to && sErr.to">{{ sErr.to }}</div></div>
          <div><label class="form-label" for="sw-why">Reason <span class="text-3">(optional)</span></label><input id="sw-why" class="form-control" v-model="sf.reason" maxlength="80" placeholder="Approved by team leader"></div>
          <div class="addbtn"><button type="submit" class="btn btn-primary"><i class="bi bi-plus-lg" aria-hidden="true"></i>Move RDO</button></div>
        </form>
      </div>
      <table class="dtable">
        <thead><tr><th scope="col">Person</th><th scope="col">Move</th><th scope="col">Check</th><th scope="col"><span class="visually-hidden">Remove</span></th></tr></thead>
        <tbody>
          <tr v-for="s in swaps" :key="s.id"><td>{{ name(s.pid) }}</td><td class="tnum">{{ nice(s.from) }} to {{ nice(s.to) }}</td><td><span class="badge-s" :class="s.status === 'OK' ? 'ok' : s.status.startsWith('OK') ? 'warn' : 'bad'">{{ s.status }}</span></td><td class="text-end"><button type="button" class="btn btn-quiet btn-icon" v-tip="'Remove ' + name(s.pid) + '\'s RDO move'" @click="removeSwap(s)"><i class="bi bi-trash3" aria-hidden="true"></i></button></td></tr>
          <tr v-if="!swaps.length"><td colspan="4" class="text-2">No RDO moves. Use the form above when someone needs a different day off.</td></tr>
        </tbody>
      </table>
    </section>
  </div>
  <div class="nextstep"><span class="text-2">All recorded? The last step is the Excel file.</span><a class="btn btn-primary" href="#excel">Next: download Excel<i class="bi bi-arrow-right" aria-hidden="true"></i></a></div>
</div>
</script>

<!-- Excel (Pattern 2: Detail of the roster file) -->
<script type="text/x-template" id="tpl-excel">
<div>
  <div class="page-head"><div><div class="stepnum">Step 4 of 4</div><h1 tabindex="-1">Download the Excel file</h1><p class="lede">The Excel file is the master copy of the roster. Share it with the team and keep it on the team drive.</p></div></div>
  <section class="surface xstate" :class="'xs-' + excelState.kind" aria-live="polite">
    <i class="bi xs-icon" :class="chip.icon" aria-hidden="true"></i>
    <div class="xs-text"><div class="xs-title">{{ excelState.title }}</div><div class="text-2">{{ excelState.text }}</div><div class="meta mt-1">File name: {{ fileName }}</div></div>
    <div class="xs-actions">
      <button type="button" class="btn btn-primary btn-lg-touch" @click="saveExcel" :aria-busy="ui.busy === 'save' ? 'true' : 'false'"><span v-if="ui.busy === 'save'" class="spinner-border spinner-border-sm" aria-hidden="true"></span><i v-else class="bi bi-download" aria-hidden="true"></i>Download Excel file</button>
    </div>
  </section>
  <section class="surface mt-3" aria-labelledby="how-h">
    <div class="section-pad"><h2 id="how-h">How the Excel file works</h2></div>
    <ol class="howlist">
      <li><b>It's the source of truth.</b> Once downloaded, the Excel file is the roster everyone works from. This app is just a helper.</li>
      <li><b>Small changes go straight into Excel.</b> Each shift cell has a dropdown, and RDO moves go in the table on the RDO sheet. The cover checks update as you type.</li>
      <li><b>For bigger changes, open it here again.</b> New starters, a longer roster or re-planning RDOs: open the Excel file in this app, make the change, then download a new copy to replace the old one.</li>
    </ol>
  </section>
  <section class="surface mt-3" aria-labelledby="sheets-h">
    <div class="section-pad"><h2 id="sheets-h">What's inside</h2></div>
    <table class="dtable"><tbody><tr v-for="[n, d] in sheets" :key="n"><th scope="row" class="sheetname">{{ n }} sheet</th><td class="text-2">{{ d }}</td></tr></tbody></table>
  </section>
  <section class="surface mt-3 section-pad openrow" aria-labelledby="open-h">
    <div><h2 id="open-h">Already have the Excel file?</h2><p class="text-2 mb-0">Open it to carry on. Changes made in Excel come with it.</p></div>
    <label class="btn btn-quiet" for="open-xlsx"><span v-if="ui.busy === 'open'" class="spinner-border spinner-border-sm" aria-hidden="true"></span><i v-else class="bi bi-folder2-open" aria-hidden="true"></i>Open Excel file<input id="open-xlsx" type="file" accept=".xlsx" class="visually-hidden" @change="pick"></label>
  </section>
</div>
</script>

<!-- Settings (Pattern 5) -->
<script type="text/x-template" id="tpl-settings">
<div>
  <div class="page-head"><div><h1 tabindex="-1">Settings</h1><p class="lede">How this roster works. These also go into the Setup sheet of the Excel file.</p></div></div>
  <form class="surface section" novalidate @submit.prevent="save">
    <div class="set-group"><h2>Roster</h2>
      <div class="fields two">
        <div><label class="form-label" for="set-title">Roster name</label><input id="set-title" class="form-control" v-model="f.title" maxlength="60" :class="{ 'is-invalid': err('title') }" @blur="t.title = true" @focus="t.title = false"><div class="invalid-msg" v-if="err('title')">{{ errors.title }}</div></div>
        <div><label class="form-label" for="set-start">First Monday</label><input id="set-start" type="date" class="form-control" v-model="f.start" :class="{ 'is-invalid': err('start') }" @blur="t.start = true" @focus="t.start = false"><div class="invalid-msg" v-if="err('start')">{{ errors.start }}</div><div class="form-text" v-else-if="moved">Not a Monday, so it starts {{ nice(moved) }}.</div></div>
        <div><label class="form-label" for="set-weeks">Length</label><select id="set-weeks" class="form-select" v-model.number="f.weeks"><option v-for="w in [2, 4, 6, 8]" :key="w" :value="w">{{ w }} weeks</option></select></div>
      </div>
    </div>
    <div class="set-group"><h2>Shifts and daily cover</h2>
      <div class="fields two">
        <div><label class="form-label" for="set-early">Early shift code</label><input id="set-early" class="form-control mono" v-model="f.early" maxlength="12" :class="{ 'is-invalid': err('early') }" @blur="t.early = true" @focus="t.early = false"><div class="invalid-msg" v-if="err('early')">{{ errors.early }}</div></div>
        <div><label class="form-label" for="set-late">Late shift code</label><input id="set-late" class="form-control mono" v-model="f.late" maxlength="12" :class="{ 'is-invalid': err('late') }" @blur="t.late = true" @focus="t.late = false"><div class="invalid-msg" v-if="err('late')">{{ errors.late }}</div></div>
        <div><label class="form-label" for="set-minEarly">Minimum on early</label><input id="set-minEarly" type="number" min="0" class="form-control" v-model="f.minEarly" :class="{ 'is-invalid': err('minEarly') }" @blur="t.minEarly = true" @focus="t.minEarly = false"><div class="invalid-msg" v-if="err('minEarly')">{{ errors.minEarly }}</div></div>
        <div><label class="form-label" for="set-minLate">Minimum on late</label><input id="set-minLate" type="number" min="0" class="form-control" v-model="f.minLate" :class="{ 'is-invalid': err('minLate') }" @blur="t.minLate = true" @focus="t.minLate = false"><div class="invalid-msg" v-if="err('minLate')">{{ errors.minLate }}</div></div>
        <div><label class="form-label" for="set-minSenior">Minimum seniors on duty</label><input id="set-minSenior" type="number" min="0" class="form-control" v-model="f.minSenior" :class="{ 'is-invalid': err('minSenior') }" @blur="t.minSenior = true" @focus="t.minSenior = false"><div class="invalid-msg" v-if="err('minSenior')">{{ errors.minSenior }}</div></div>
      </div>
    </div>
    <div class="set-group"><h2>Rotations</h2><p class="text-2 small-2 prose">Analyst numbers follow the order on the Team page.</p>
      <div class="rot-set">
        <div class="form-check form-switch"><input id="set-fdOn" class="form-check-input" type="checkbox" role="switch" v-model="f.fdOn"><label class="form-check-label fw-semibold" for="set-fdOn">Front desk, one analyst a day</label></div>
        <div class="fields two" v-if="f.fdOn">
          <div><label class="form-label" for="set-fdLabel">Name</label><input id="set-fdLabel" class="form-control" v-model="f.fdLabel" maxlength="30"></div>
          <div><label class="form-label" for="set-fdStart">Analyst number on day 1</label><input id="set-fdStart" type="number" min="1" class="form-control" v-model="f.fdStart" :class="{ 'is-invalid': err('fdStart') }" @blur="t.fdStart = true" @focus="t.fdStart = false"><div class="invalid-msg" v-if="err('fdStart')">{{ errors.fdStart }}</div></div>
        </div>
      </div>
      <div class="rot-set">
        <div class="form-check form-switch"><input id="set-sbOn" class="form-check-input" type="checkbox" role="switch" v-model="f.sbOn"><label class="form-check-label fw-semibold" for="set-sbOn">Second site, 2 seats, weekly</label></div>
        <div class="fields two" v-if="f.sbOn">
          <div><label class="form-label" for="set-sbLabel">Site name</label><input id="set-sbLabel" class="form-control" v-model="f.sbLabel" maxlength="30"></div>
          <div><label class="form-label" for="set-sbMin">Minimum working there</label><input id="set-sbMin" type="number" min="0" max="2" class="form-control" v-model="f.sbMin" :class="{ 'is-invalid': err('sbMin') }" @blur="t.sbMin = true" @focus="t.sbMin = false"><div class="invalid-msg" v-if="err('sbMin')">{{ errors.sbMin }}</div></div>
          <div><label class="form-label" for="set-seat1">Seat 1 analyst in week 1</label><input id="set-seat1" type="number" min="1" class="form-control" v-model="f.seat1" :class="{ 'is-invalid': err('seat1') }" @blur="t.seat1 = true" @focus="t.seat1 = false"><div class="invalid-msg" v-if="err('seat1')">{{ errors.seat1 }}</div></div>
          <div><label class="form-label" for="set-seat2">Seat 2 analyst from Wednesday</label><input id="set-seat2" type="number" min="1" class="form-control" v-model="f.seat2" :class="{ 'is-invalid': err('seat2') }" @blur="t.seat2 = true" @focus="t.seat2 = false"><div class="invalid-msg" v-if="err('seat2')">{{ errors.seat2 }}</div></div>
        </div>
      </div>
      <div class="rot-set">
        <div class="form-check form-switch"><input id="set-ocOn" class="form-check-input" type="checkbox" role="switch" v-model="f.ocOn"><label class="form-check-label fw-semibold" for="set-ocOn">On call, weekly</label></div>
        <div class="fields two" v-if="f.ocOn">
          <div><label class="form-label" for="set-ocLabel">Name</label><input id="set-ocLabel" class="form-control" v-model="f.ocLabel" maxlength="30"></div>
          <div><label class="form-label" for="set-ocPool">People in the pool</label><input id="set-ocPool" type="number" min="1" class="form-control" v-model="f.ocPool" :class="{ 'is-invalid': err('ocPool') }" @blur="t.ocPool = true" @focus="t.ocPool = false"><div class="invalid-msg" v-if="err('ocPool')">{{ errors.ocPool }}</div><div class="form-text">Seniors first, then analysts.</div></div>
          <div><label class="form-label" for="set-ocStart">Pool position in week 1</label><input id="set-ocStart" type="number" min="1" class="form-control" v-model="f.ocStart" :class="{ 'is-invalid': err('ocStart') }" @blur="t.ocStart = true" @focus="t.ocStart = false"><div class="invalid-msg" v-if="err('ocStart')">{{ errors.ocStart }}</div></div>
        </div>
      </div>
    </div>
    <div class="set-group"><h2>RDO days</h2>
      <fieldset><legend class="form-label">Days RDOs can fall on when re-planning</legend>
        <div class="days-row"><div v-for="(d, k) in E.DAYS" :key="d" class="form-check"><input :id="'set-rdo-' + k" class="form-check-input" type="checkbox" :value="k + 1" v-model="f.rdoDays"><label class="form-check-label" :for="'set-rdo-' + k">{{ d }}</label></div></div>
        <div class="invalid-msg" id="set-rdoDays" tabindex="-1" v-if="t.rdoDays && errors.rdoDays">{{ errors.rdoDays }}</div>
      </fieldset>
    </div>
    <div class="save-row"><button type="submit" class="btn btn-primary">Save changes</button><button type="button" class="btn btn-link-quiet" @click="reset">Discard changes</button><span v-if="saved" class="saved-note" role="status"><i class="bi bi-check2" aria-hidden="true"></i> Saved</span></div>
  </form>
  <p class="meta mt-3">Roster Builder v4.0 (4 Nov 2026). Rapid prototype, not an endorsed tool.</p>
  <div class="danger-zone">
    <h3>Start again</h3>
    <div class="danger-row"><span class="text-2 small-2">Replace the roster in this browser with the sample team. Excel files you downloaded are not affected.</span><button type="button" class="btn btn-danger-quiet" @click="startAgain">Start again</button></div>
  </div>
</div>
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.38/vue.global.prod.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" defer></script>
<script src="js/engine.js"></script>
<script src="js/planner.js"></script>
<script src="js/app.js"></script>
<style>[v-cloak] { display: none; }</style>
</body>
</html>
